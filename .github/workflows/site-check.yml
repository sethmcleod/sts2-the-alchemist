name: site-check

on:
  push:
    branches: [beta, main]
    paths:
      - 'site/**'
      - '.github/workflows/site-check.yml'
  pull_request:
    paths:
      - 'site/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check .
